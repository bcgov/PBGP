name: OpenShift Build and Deploy to Respective env

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

env:
  CLUSTER: https://api.silver.devops.gov.bc.ca:6443
  AUTH_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

jobs:
  deploy:
    name: OpenShift Build & Deploy
    runs-on: ubuntu-latest
    concurrency: ci-build
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Set DEPLOY_ENV variable
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]
          then
            deploy_env=test
          elif [[ "$BRANCH_NAME" == "main" ]]
          then
            deploy_env=prod
          elif [[ "$BRANCH_NAME" == "develop" ]]
          then
            deploy_env=dev
          else
            echo "Unsupported deployment branch: $BRANCH_NAME" >&2
            exit 1
          fi
          echo "DEPLOY_ENV=$deploy_env" >> "$GITHUB_OUTPUT"
        id: DEPLOY_ENV

      - name: Build & Deploy
        run: |
          oc login --token=$AUTH_TOKEN --server=$CLUSTER
          oc patch bc/pbgp-client -p '{"spec":{"source":{"git":{"ref": "${{ github.head_ref || github.ref_name }}" }},"output":{"to":{"name":"pbgp-client:${{ steps.DEPLOY_ENV.outputs.DEPLOY_ENV }}"}},"resources":{"requests":{"cpu":"500m","memory":"1Gi"},"limits":{"cpu":"1","memory":"2Gi"}}}}' -n ed9154-tools
          oc patch bc/pbgp-server -p '{"spec":{"source":{"git":{"ref": "${{ github.head_ref || github.ref_name }}" }},"output":{"to":{"name":"pbgp-server:${{ steps.DEPLOY_ENV.outputs.DEPLOY_ENV }}"}},"resources":{"requests":{"cpu":"500m","memory":"1Gi"},"limits":{"cpu":"1","memory":"2Gi"}}}}' -n ed9154-tools
          make server-build OS_NAMESPACE_SUFFIX=${{ steps.DEPLOY_ENV.outputs.DEPLOY_ENV }}
